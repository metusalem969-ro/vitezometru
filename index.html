<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f4f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vitezometru</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --ink:#111114;          /* cifrele: negru aproape pur, maxim contrast pe fundal alb */
    --ink-dim:#8a8a90;
    --over:#e0242c;
    --chrome:#6b6b70;
    --bg:#f4f4f6;           /* fundal deschis, cerut explicit */
    --panel-bg:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%}

  #stage{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition:color .18s linear}
  #stage.mirror #readout,#stage.mirror #foot{transform:scaleX(-1)}
  #stage.over{color:var(--over)}

  /* banner de stare: mereu vizibil, sus, indiferent de panou.
     Aici apare orice mesaj important - inclusiv erorile. */
  #status{flex:0 0 auto;padding:14px 5vw 8px;font-size:15px;line-height:1.5;
    color:#5a5a60;min-height:1.6em;text-align:center}
  #status.err{color:#c81e26;font-weight:600}
  #status.ok{color:#1a8a4a}

  /* numarul: SVG, ca sa fie identic de mare pe orice telefon */
  #readout{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 4vw}
  #readout svg{width:100%;height:100%;display:block}
  #num{font-weight:800;font-size:100px;letter-spacing:-4px;fill:currentColor;
    font-variant-numeric:tabular-nums}
  #stage.stale #readout{opacity:.35}

  #foot{display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 6vw 4vh;gap:16px;font-size:15px;letter-spacing:.4px}
  #unit{font-weight:700;font-size:clamp(18px,5vw,26px);color:currentColor}
  #hint{color:var(--chrome);font-size:13px;line-height:1.5;text-align:right;max-width:52%}
  #limit{font-weight:700;font-size:clamp(18px,5vw,26px);color:currentColor;
    border:3px solid currentColor;border-radius:50%;
    width:2.6em;height:2.6em;display:flex;align-items:center;justify-content:center;
    font-size:clamp(14px,3.6vw,20px)}
  #limit.unset{color:var(--chrome);border-color:var(--chrome)}

  /* panoul de comenzi: ascuns pana atingi ecranul; se inchide DOAR cu X sau timeout */
  #panel{position:fixed;inset:auto 0 0 0;background:var(--panel-bg);border-top:1px solid #dcdce0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px rgba(0,0,0,.08);
    transform:translateY(110%);transition:transform .22s ease;z-index:5}
  #panel.open{transform:none}
  #panelHead{display:flex;justify-content:flex-end;padding:4px 0 8px}
  #panelClose{background:none;border:0;color:#6b6b70;font-size:22px;line-height:1;
    padding:6px 12px;cursor:pointer}
  #panelGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  button{font:inherit;font-size:15px;font-weight:600;color:#26262a;background:#eeeef1;
    border:1px solid #dcdce0;border-radius:10px;padding:14px 10px;cursor:pointer}
  button:active{background:#e2e2e6}
  button.wide{grid-column:1/-1}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:10;flex-direction:column;gap:20px;padding:32px;text-align:center}
  #start p{color:#5a5a60;font-size:15px;line-height:1.6;max-width:30ch}
  #start button{background:var(--ink);color:#fff;border:0;font-size:18px;padding:18px 34px;border-radius:12px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="stage" class="stale">
  <div id="status">se așteaptă pornirea…</div>
  <div id="readout">
    <svg id="svg" viewBox="0 0 180 120" preserveAspectRatio="xMidYMid meet">
      <text id="num" x="90" y="98" text-anchor="middle">--</text>
    </svg>
  </div>
  <div id="foot">
    <span id="unit">km/h</span>
    <div style="display:flex;align-items:center;gap:14px">
      <div id="limit" class="unset">--</div>
      <span id="hint">atinge ecranul<br>pentru comenzi</span>
    </div>
  </div>
</div>

<div id="panel">
  <div id="panelHead"><button id="panelClose" aria-label="Închide">✕</button></div>
  <div id="panelGrid">
    <button id="bUnit">Treci pe mph</button>
    <button id="bMirror">Oglindă (HUD)</button>
    <button id="bLimitDown">Limită −10</button>
    <button id="bLimitUp">Limită +10</button>
    <button id="bFull" class="wide">Ecran complet</button>
  </div>
</div>

<div id="start">
  <p>Vitezometru GPS. Nu are nevoie de internet — doar de semnal de la sateliți. Ține telefonul cu ecranul spre cer, lângă parbriz.</p>
  <button id="go">Pornește</button>
</div>

<script>
(function(){
  "use strict";
  var stage=document.getElementById("stage"), svg=document.getElementById("svg"),
      num=document.getElementById("num"), unitEl=document.getElementById("unit"),
      limitEl=document.getElementById("limit"), hintEl=document.getElementById("hint"),
      statusEl=document.getElementById("status"),
      panel=document.getElementById("panel"), start=document.getElementById("start");

  function setStatus(text, kind){
    statusEl.textContent = text;
    statusEl.className = kind || "";
  }

  var mph=false, mirror=false, limit=0, wakeLock=null, watchId=null;
  var lastFix=0, lastPos=null, hideTimer=null, wasOver=false;
  var targetKmh=0, shownKmh=0, lastAccuracy=null, lastGapMs=0;

  // ---- afisare: ruleaza la ~30 cadre/secunda, INDIFERENT cat de des vine GPS-ul ----
  function render(){
    var stale = (Date.now()-lastFix) > 6000;

    // apropiem valoarea afisata de tinta, dar nu instant -> miscare continua, nu salturi
    var diff = targetKmh - shownKmh;
    if (Math.abs(diff) < 0.15) shownKmh = targetKmh;
    else shownKmh += diff * 0.35;
    if (stale) shownKmh *= 0.96;    // daca semnalul lipseste, coboara lin spre 0, nu ingheata

    var v = mph ? shownKmh*0.621371 : shownKmh;
    var shown = (lastFix===0) ? "--" : String(Math.round(Math.max(0,v)));
    var n = shown.length;
    var w = 62*n + 18;
    svg.setAttribute("viewBox","0 0 "+w+" 120");
    num.setAttribute("x", w/2);
    num.textContent = shown;
    stage.classList.toggle("stale", stale || lastFix===0);

    var over = !stale && limit>0 && Math.round(v) > limit;
    stage.classList.toggle("over", over);
    if(over && !wasOver && navigator.vibrate) navigator.vibrate([90,60,90]);
    wasOver = over;

    unitEl.textContent = mph ? "mph" : "km/h";
    limitEl.textContent = limit>0 ? limit : "--";
    limitEl.classList.toggle("unset", limit===0);
  }

  // ---- GPS ----
  var speedHistory = [];
  var usingDoppler = null;
  var basePos = null, baseTime = 0, lastAcceptTime = 0;

  function onPos(p){
    var c=p.coords, v=null, fromDoppler=false;

    if(c.speed!==null && !isNaN(c.speed) && c.speed>=0){
      v = c.speed*3.6;                       // telefonul da viteza direct (Doppler) - stabila
      fromDoppler = true;
      basePos = p; baseTime = p.timestamp;   // resetam fereastra, nu mai e nevoie de ea
    } else {
      // Fallback fara Doppler: la viteza mica, o SINGURA citire noua nu e de ajuns -
      // zgomotul normal al GPS-ului (8-15m, chiar stationar) e mai mare decat
      // distanta reala parcursa intr-o secunda la 15-30 km/h. Solutia corecta e
      // sa acumulam distanta pe o fereastra care creste pana iese clar din zgomot,
      // apoi calculam viteza pe acel interval - nu pe ultimele 2 puncte brute.
      if (!basePos) { basePos = p; baseTime = p.timestamp; }
      else {
        var dt = (p.timestamp - baseTime) / 1000;
        var d  = dist(basePos.coords, c);
        var noiseFloor = (c.accuracy||30) + (basePos.coords.accuracy||30);
        if (d > noiseFloor * 1.6) {
          v = d / dt * 3.6;
          basePos = p; baseTime = p.timestamp;      // fereastra se inchide, pornim una noua
        } else if (dt > 6) {
          // 6 secunde fara sa iesim clar din zgomot: calculam oricum, cu ce avem,
          // ca sa nu ramanem blocati la infinit daca miscarea e foarte lenta
          v = d / dt * 3.6;
          basePos = p; baseTime = p.timestamp;
        }
        // altfel: asteptam in continuare, v ramane null
      }
    }

    var gapMs = lastFix ? (Date.now() - lastFix) : 0;
    lastAccuracy = c.accuracy;
    if (usingDoppler === null) usingDoppler = fromDoppler;

    if (v === null) { render(); return; }
    if (v < 2.0) v = 0;

    // resping salturi fizic imposibile fata de ultima valoare ACCEPTATA
    // (nu fata de ce arata ecranul acum) - o masina nu accelereaza/franeaza
    // mai mult de ~15 km/h pe secunda in conditii normale de oras
    var dtSinceAccept = lastAcceptTime ? (p.timestamp - lastAcceptTime) / 1000 : 999;
    var maxJump = 15 * dtSinceAccept + 10;
    if (lastAcceptTime && Math.abs(v - targetKmh) > maxJump) {
      render();
      return;                                    // ignoram citirea aberanta
    }

    // filtru median pe ultimele 5 citiri valide: elimina spike-uri izolate ramase
    speedHistory.push(v);
    if (speedHistory.length > 5) speedHistory.shift();
    var sorted = speedHistory.slice().sort(function(a,b){return a-b;});
    var filtered = sorted[Math.floor(sorted.length/2)];

    targetKmh = filtered;
    lastFix = Date.now();
    lastAcceptTime = p.timestamp;
    if (gapMs > 50) lastGapMs = gapMs;

    var precise = c.accuracy <= 25;
    var src = fromDoppler ? "GPS direct" : "calculată";
    setStatus((precise?"semnal bun":"semnal slab")+" ("+src+") — ±"+Math.round(c.accuracy)+
              "m — la ~"+(Math.round(lastGapMs/100)/10)+"s", precise?"ok":"");
  }
  function onErr(e){
    if(e.code===1){
      setStatus("Locația e blocată pentru această pagină. Verifică: setările browserului → Locație → permite acest site, plus Locația (GPS) pornită pe telefon.", "err");
    }else if(e.code===2){
      setStatus("Nu se poate determina poziția. Ieși afară, sub cer liber.", "err");
    }else{
      setStatus("GPS-ul nu răspunde încă. Așteaptă sau ieși afară.", "err");
    }
    render();
  }
  function dist(a,b){
    var R=6371000, r=Math.PI/180;
    var dLa=(b.latitude-a.latitude)*r, dLo=(b.longitude-a.longitude)*r;
    var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*
          Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
  }

  // ---- ecranul nu trebuie sa se stinga ----
  async function keepAwake(){
    try{
      if("wakeLock" in navigator){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", function(){ wakeLock=null; });
      }
    }catch(e){}
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible" && !wakeLock) keepAwake();
  });

  // ---- comenzi ----
  function showPanel(){
    panel.classList.add("open");
    clearTimeout(hideTimer);
    hideTimer=setTimeout(hidePanel, 8000);
  }
  function hidePanel(){
    clearTimeout(hideTimer);
    panel.classList.remove("open");
  }
  document.getElementById("stage").addEventListener("click", function(e){
    if(panel.classList.contains("open")) return;   // primul tap doar deschide
    showPanel();
  });
  document.getElementById("panelClose").addEventListener("click", hidePanel);
  // orice apasare pe un buton din panou reporneste timerul, dar nu-l inchide singura

  document.getElementById("panelGrid").addEventListener("click", function(){
    clearTimeout(hideTimer);
    hideTimer=setTimeout(hidePanel, 8000);
  });
  document.getElementById("bUnit").addEventListener("click", function(){
    mph=!mph; this.textContent = mph ? "Treci pe km/h" : "Treci pe mph"; render();
  });
  document.getElementById("bMirror").addEventListener("click", function(){
    mirror=!mirror; stage.classList.toggle("mirror", mirror);
  });
  document.getElementById("bLimitUp").addEventListener("click", function(){
    limit=Math.min(200, limit+10); render();
  });
  document.getElementById("bLimitDown").addEventListener("click", function(){
    limit=Math.max(0, limit-10); render();
  });
  document.getElementById("bFull").addEventListener("click", function(){
    var el=document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function(){});
    else if(document.exitFullscreen) document.exitFullscreen();
  });

  document.getElementById("go").addEventListener("click", function(){
    start.remove();
    keepAwake();
    if(!window.isSecureContext){
      setStatus("Deschide pagina printr-un link https, nu direct dintr-un fișier.", "err");
      return;
    }
    if(!navigator.geolocation){
      setStatus("Acest browser nu oferă acces la locație.", "err");
      return;
    }
    setStatus("se caută semnal GPS…");
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {
      enableHighAccuracy:true, maximumAge:0, timeout:15000
    });
    // bucla vizuala ruleaza continuu, indiferent cat de des trimite GPS-ul date noi.
    // asta e ce face cifra sa se miste lin, nu doar sa sara la fiecare puls GPS.
    var lastFrame=0;
    function loop(t){
      if(!lastFrame || t-lastFrame>=33){ lastFrame=t; render(); }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    render();
  });

  // dupa prima incarcare, pagina ramane disponibila si complet fara internet
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }

  render();
})();
</script>
</body>
</html>
